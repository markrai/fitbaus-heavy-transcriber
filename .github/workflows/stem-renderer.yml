name: STEM renderer smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Renderer CI
        run: python ci.py renderer
      - uses: actions/upload-artifact@v4
        with:
          name: stem-renderer-package-lock
          path: stem/renderer/package-lock.json
