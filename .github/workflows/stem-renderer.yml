name: STEM renderer smoke
on:
  pull_request:
    paths:
      - 'stem/renderer/**'
      - 'stem/qualify_render.py'
      - 'stem/renderer_smoke.py'
      - 'stem/dictionary.py'
      - 'tests/test_stem_qualify_render.py'
      - 'tests/test_ci_driver.py'
      - 'ci.py'
      - 'ci.bat'
      - 'ci.sh'
      - '.github/workflows/stem-renderer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Renderer CI
        run: python ci.py renderer
      - uses: actions/upload-artifact@v4
        with:
          name: stem-renderer-package-lock
          path: stem/renderer/package-lock.json
